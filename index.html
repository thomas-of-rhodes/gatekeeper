<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gatekeeper</title>
<style>
:root{--bg:#c9c9bf;--bezel:#2b2b28;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--bezel:#000;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#1d1d1b;--bezel:#000;color-scheme:dark;}
html{height:100%;}
body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#bezel{background:var(--bezel);padding:6px;border-radius:8px;line-height:0;}
canvas{display:block;outline:none;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;}
</style>
</head>
<body>
<div id="bezel"><canvas id="game" aria-label="Gatekeeper game: hold any key, click or tap to lift the reject gate"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events } = window.Matter;

// ================= canvas =================
const W = 320, H = 180, STEP = 1 / 60;
const cvs = document.getElementById('game');
cvs.width = W; cvs.height = H;
cvs.tabIndex = 0; // lets the game take keyboard focus when it sits inside another page
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
const shCvs = document.createElement('canvas'); shCvs.width = W; shCvs.height = H;
const shg = shCvs.getContext('2d'); shg.imageSmoothingEnabled = false;

// ================= palette (4 greys) =================
const PALS = {
  day:   ['#e2e2d8', '#a4a49a', '#585852', '#181816'],
  night: ['#9a9a92', '#66665f', '#363632', '#0d0d0c'],
};
let P = PALS.day, PRGB = [];
const spriteCache = {}, glyphCache = {};
let ditherPat = null;
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function setPalette(k) {
  P = PALS[k]; PRGB = P.map(hexRgb);
  for (const a in spriteCache) delete spriteCache[a];
  for (const a in glyphCache) delete glyphCache[a];
  const c = document.createElement('canvas'); c.width = 2; c.height = 2;
  const g = c.getContext('2d'); g.fillStyle = P[3]; g.fillRect(0, 0, 1, 1); g.fillRect(1, 1, 1, 1);
  ditherPat = shg.createPattern(c, 'repeat');
}

// ================= helpers =================
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function hash(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function rect(x, y, w, h, c) { ctx.fillStyle = P[c]; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function px(x, y, c) { ctx.fillStyle = P[c]; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function disc(cx, cy, r, c) {
  ctx.fillStyle = P[c]; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * .8)); ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
}
function thickLine(x0, y0, x1, y1, r, c) {
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
  for (let i = 0; i <= n; i++) { const t = i / n; disc(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r, c); }
}
function angDev(a) { a = ((a % Math.PI) + Math.PI) % Math.PI; return Math.min(a, Math.PI - a); }

// ================= sprites =================
const SPR = {};
function defA(key, rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const d = new Int8Array(w * h).fill(-1);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const c = r.charCodeAt(x) - 48; if (c >= 0 && c <= 3) d[y * w + x] = c; } });
  SPR[key] = { w, h, d };
}
function defP(key, w, h, fn) {
  const d = new Int8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) d[y * w + x] = fn(x, y);
  SPR[key] = { w, h, d };
}
function spr(key, mode) {
  const ck = key + '|' + mode; let c = spriteCache[ck]; if (c) return c;
  const s = SPR[key]; c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
  const g = c.getContext('2d'); const im = g.createImageData(s.w, s.h);
  for (let i = 0; i < s.d.length; i++) {
    const v = s.d[i]; if (v < 0) continue;
    const idx = mode === 'n' ? v : mode === 'inv' ? 3 - v : +mode;
    const rgb = PRGB[idx];
    im.data[i * 4] = rgb[0]; im.data[i * 4 + 1] = rgb[1]; im.data[i * 4 + 2] = rgb[2]; im.data[i * 4 + 3] = 255;
  }
  g.putImageData(im, 0, 0); spriteCache[ck] = c; return c;
}
function drawSpr(key, mode, x, y, ang, sx, sy, g) {
  g = g || ctx; const c = spr(key, mode);
  g.save(); g.translate(Math.round(x), Math.round(y));
  if (ang) g.rotate(ang);
  if ((sx && sx !== 1) || (sy && sy !== 1)) g.scale(sx || 1, sy || 1);
  g.drawImage(c, -(c.width >> 1), -(c.height >> 1));
  g.restore();
}

function genSprites() {
  // --- products ---
  const punnet = alt => (x, y) => {
    if (x === 0 || y === 0 || x === 13 || y === 9) return 3;
    if (x === 1 || y === 1 || x === 12 || y === 8) return 0;
    const bx = (x - 2 + (y > 4 ? 1 : 0)) % 3, by = (y - 2) % 3;
    if (bx < 2 && by < 2) return (bx === 0 && by === 0) ? (alt ? 1 : 0) : (alt ? 3 : 2);
    return 1;
  };
  defP('strawb', 14, 10, punnet(false)); defP('strawb_alt', 14, 10, punnet(true));
  defP('box', 18, 14, (x, y) => { if (x === 0 || y === 0 || x === 17 || y === 13) return 3; if (x === 8 || x === 9) return 0; if (y === 6 || y === 7) return 2; if ((x === 2 || x === 15) && (y === 2 || y === 11)) return 2; return 1; });
  defP('box_alt', 18, 14, (x, y) => { if (x === 0 || y === 0 || x === 17 || y === 13) return 3; if (y === 6 || y === 7) return 0; if (x === 8 || x === 9) return 2; if ((x === 2 || x === 15) && (y === 2 || y === 11)) return 2; return 1; });
  const salad = alt => (x, y) => {
    const ex = x === 0 || x === 15, ey = y === 0 || y === 11;
    if (ex && ey) return -1;
    if (x <= 1 || x >= 14) return (y % 2) ? 2 : 3;
    if (ey) return 3;
    if (x >= 6 && x <= 9 && y >= 4 && y <= 7) return (y === 5 && x > 6 && x < 9) ? 0 : 2;
    const h = hash(x, y, 3); return alt ? (h < .6 ? 2 : 1) : (h < .45 ? 1 : 0);
  };
  defP('salad', 16, 12, salad(false)); defP('salad_alt', 16, 12, salad(true));
  const eggs = alt => (x, y) => {
    if (x === 0 || y === 0 || x === 15 || y === 9) return 3;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {
      const ex = 3.1 + i * 4.9, ey = 2.7 + j * 4.5;
      if (Math.hypot((x - ex) / 1.8, (y - ey) / 1.6) < 1) return (alt && i === 1 && j === 1) ? 1 : 0;
    }
    return 2;
  };
  defP('eggs', 16, 10, eggs(false)); defP('eggs_alt', 16, 10, eggs(true));
  const mush = alt => (x, y) => {
    if (x === 0 || y === 0 || x === 10 || y === 8) return 3;
    const C = [[3, 2.5], [7.2, 2.5], [2.8, 6], [7.5, 6], [5.2, 4.3]];
    for (const [cx, cy] of C) { const d = Math.hypot(x - cx, y - cy); if (d < 1.3) return alt ? 1 : 0; if (d < 1.9) return alt ? 2 : 1; }
    return 2;
  };
  defP('mush', 11, 9, mush(false)); defP('mush_alt', 11, 9, mush(true));
  for (const s of Object.values(SKUS)) {
    defP('crack_' + s.id, s.w, s.h, (x, y) => {
      const cy = s.h / 2 + Math.sin(x * 1.7 + s.w) * 1.6;
      if (x > 1 && x < s.w - 2 && Math.abs(y - cy) < .6) return 3;
      if (x > 0 && y > 0 && x < s.w - 1 && y < s.h - 1 && hash(x, y, 9) < .06) return 0;
      return -1;
    });
  }
  // --- things that should not be on the line ---
  defA('boombox', [
    '....33333333333333....',
    '....3............3....',
    '3333333333333333333333',
    '3111111111111111111113',
    '3133331222222221333313',
    '3132231200000021322313',
    '3132231200000021322313',
    '3133331222222221333313',
    '3111111111111111111113',
    '3110101011111110101013',
    '3111111111111111111113',
    '3333333333333333333333']);
  defA('bat', [
    '.'.repeat(10) + '3'.repeat(20),
    '3'.repeat(10) + '3' + '1'.repeat(18) + '3',
    '3232323232' + '3' + '1'.repeat(7) + '0000' + '1'.repeat(7) + '3',
    '3'.repeat(10) + '3' + '1'.repeat(18) + '3',
    '.'.repeat(10) + '3'.repeat(20)]);
  defA('cat', [
    '.3...3..........',
    '3233323.........',
    '3222223333333...',
    '3020203222222233',
    '3221223222222223',
    '3222223212121223',
    '.333332121212123',
    '......3222222223',
    '......3333333323',
    '...........3223.',
    '............33..']);
  defA('chicken', [
    '...22.......',
    '..3003......',
    '..30303.....',
    '.113003.....',
    '...3003.333.',
    '...300033003',
    '..3000000003',
    '..3001100003',
    '..3000110003',
    '...30000003.',
    '....333333..',
    '.....1..1...']);
  defA('sock', [
    '.3333...', '.3223...', '.3003...', '.3113...', '.3113...', '.3113...',
    '.3113...', '.31133..', '.311113.', '.3111103', '..33333.']);
  defA('bone', [
    '.33..........33.',
    '3003333333333003',
    '.30000000000003.',
    '3003333333333003',
    '.33..........33.']);
  defP('brick', 14, 7, (x, y) => { if (x === 0 || y === 0 || x === 13 || y === 6) return 3; if (y === 3) return 2; if ((y < 3 && x === 7) || (y > 3 && (x === 3 || x === 10))) return 2; return 1; });
  defP('lorry', 30, 13, (x, y) => {
    for (const wx of [4, 9, 18, 26]) if (Math.hypot(x - wx, y - 11) < 1.6) return (x === wx && y === 11) ? 1 : 3;
    if (y === 9) return 3;
    if (x <= 20 && y <= 8) { if (x === 0 || y === 0 || x === 20 || y === 8) return 3; return y === 4 ? 1 : 0; }
    if (x >= 22 && y >= 2 && y <= 8) { if (x === 22 || y === 2 || x === 29 || y === 8) return 3; if (x >= 24 && x <= 28 && y >= 3 && y <= 5) return 2; return 1; }
    return -1;
  });
}

// ================= font (3x5) =================
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001001010010', '8': '111101111101111', '9': '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', '.': '000000000000010', ':': '000010000010000', '!': '010010010000010', '-': '000000111000000',
  '+': '000010111010000', '/': '001001010100100', '?': '111001010000010', ',': '000000000010100', '%': '101001010100101',
  '<': '001010100010001', '>': '100010001010100', '^': '000010111000000', '~': '000111010000000',
};
function glyph(ch, c) {
  const k = ch + c; let g = glyphCache[k]; if (g) return g;
  const bits = FONT[ch] || FONT['?'];
  g = document.createElement('canvas'); g.width = 3; g.height = 5;
  const gg = g.getContext('2d'); gg.fillStyle = P[c];
  for (let i = 0; i < 15; i++) if (bits[i] === '1') gg.fillRect(i % 3, (i / 3) | 0, 1, 1);
  glyphCache[k] = g; return g;
}
function text(s, x, y, c, align, sc) {
  s = String(s).toUpperCase(); sc = sc || 1; c = c === undefined ? 0 : c;
  const w = (s.length * 4 - 1) * sc;
  if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], c), x + i * 4 * sc, y, 3 * sc, 5 * sc);
}
const pad = (n, l) => String(Math.max(0, Math.floor(n))).padStart(l, '0');

// ================= layout & tuning =================
const BELT_X0 = 40, BELT_X1 = 302, BELT_Y0 = 112, BELT_Y1 = 150, BELT_CY = 131;
const GATE_X = 268, JOINT_X = 150, SPAWN_X = 20;
const TRAY_X = 172, TRAY_Y = 18, TRAY_SLOTS = 4;
const SHOULDER = { x: 140, y: 72 }, L1 = 72, L2 = 72;
const HOME = { x: 228, y: 102, z: 18 }, RACK = { x: 108, y: 100, z: 8 };
const TRAYS_PER_PALLET = 8, PALLETS_PER_LORRY = 4, MAX_STRIKES = 3;
const PPM_START = 50, PPM_RATE = 0.45, PPM_MAX = 150;
const SHIFT_LEN = 180, SHIFTS = ['DAY', 'LATE', 'NIGHT'];
const WASTE_PENALTY = 5, SNAP = 0.26, SEAL = 0.6;

const SKUS = {
  strawb: { id: 'strawb', name: 'STRAWBS', key: 'strawb', w: 14, h: 10, n: 4, density: .0012, friction: .3, grip: 1, fragility: .7, soft: .25, height: 3 },
  box:    { id: 'box', name: 'BOXES', key: 'box', w: 18, h: 14, n: 2, density: .003, friction: .2, grip: .8, fragility: .3, soft: .05, height: 5 },
  salad:  { id: 'salad', name: 'SALAD', key: 'salad', w: 16, h: 12, n: 3, density: .0007, friction: .55, grip: 1.2, fragility: .25, soft: .8, height: 3 },
  eggs:   { id: 'eggs', name: 'EGGS', key: 'eggs', w: 16, h: 10, n: 3, density: .0014, friction: .3, grip: 1, fragility: 1.5, soft: .1, height: 3 },
  mush:   { id: 'mush', name: 'MUSHROOMS', key: 'mush', w: 11, h: 9, n: 5, density: .001, friction: .35, grip: 1, fragility: .8, soft: .25, height: 3 },
};
const SKU_ORDER = ['strawb', 'box', 'salad', 'eggs', 'mush', 'strawb'];
const FOREIGN = [
  { key: 'boombox', w: 22, h: 12, density: .004, friction: .35, height: 5, unlock: 0 },
  { key: 'bat', w: 30, h: 5, density: .0018, friction: .2, height: 2, unlock: 0 },
  { key: 'cat', w: 16, h: 11, density: .005, friction: .9, height: 4, unlock: 0, chamfer: 3 },
  { key: 'chicken', w: 12, h: 12, density: .0015, friction: .3, height: 4, unlock: 45, circle: true, wander: true },
  { key: 'brick', w: 14, h: 7, density: .006, friction: .6, height: 4, unlock: 45 },
  { key: 'sock', w: 8, h: 11, density: .0006, friction: .6, height: 1, unlock: 45 },
  { key: 'bone', w: 16, h: 5, density: .002, friction: .3, height: 2, unlock: 110 },
];

// ================= physics =================
const engine = Engine.create({ gravity: { x: 0, y: 0, scale: 0 } });
engine.positionIterations = 10; engine.velocityIterations = 8;
const world = engine.world;
let items = [], railBodies = [], railTop = [], railBot = [];
const gateBody = Bodies.rectangle(GATE_X, BELT_CY, 5, BELT_Y1 - BELT_Y0 + 8, { isStatic: true, label: 'gate', friction: .1 });
Composite.add(world, gateBody);

function seg(x1, y1, x2, y2) {
  const t = 3, len = Math.hypot(x2 - x1, y2 - y1);
  return Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, len + t, t, { isStatic: true, angle: Math.atan2(y2 - y1, x2 - x1), friction: 0, label: 'rail' });
}
function buildRails(laneHalf) {
  Composite.remove(world, railBodies);
  const top = BELT_CY - laneHalf - 1.5, bot = BELT_CY + laneHalf + 1.5;
  // straight single-lane guides, with one slightly proud rail joint that loves to catch a corner
  // guides stop just short of the gate; nothing beyond it
  railTop = [[0, top], [JOINT_X, top], [JOINT_X + 3, top + 1.5], [JOINT_X + 8, top + 1.5], [JOINT_X + 11, top], [GATE_X - 8, top]];
  railBot = [[0, bot], [GATE_X - 8, bot]];
  railBodies = [];
  for (const r of [railTop, railBot]) for (let i = 0; i < r.length - 1; i++) railBodies.push(seg(r[i][0], r[i][1], r[i + 1][0], r[i + 1][1]));
  Composite.add(world, railBodies);
}
function removeBody(b) { Composite.remove(world, b); const i = items.indexOf(b); if (i >= 0) items.splice(i, 1); }
function clearItems() { for (const b of items.slice()) Composite.remove(world, b); items = []; }

Events.on(engine, 'collisionStart', ev => {
  for (const pr of ev.pairs) { const a = pr.bodyA.parent, b = pr.bodyB.parent; impact(a, b); impact(b, a); }
});
function impact(a, b) {
  const it = a.plugin && a.plugin.item; if (!it) return;
  if (b.isStatic && b.label !== 'gate') return;
  const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
  const mb = b.isStatic ? a.mass * 3 : b.mass;
  const imp = rv * 2 * mb / (a.mass + mb);
  const thr = beltV * 1.15 + .35;
  if (imp > thr) it.damage += (imp - thr) * it.fragility * 1.3;
  it.squash = Math.min(1, it.squash + imp * it.soft * .8);
}

// ================= game state =================
let state = 'title', stateT = 0, time = 0;
let sku = SKUS.strawb, laserX = 0;
let ppm = PPM_START, peak = PPM_START, beltV = 0, beltOff = 0, runT = 0;
// the belt runs in fixed speed settings, stepping up every 20 PPM; spawn rate rises smoothly in between
let beltSet = 0, beltSpeed = 0;
function beltSpeedFor(p) { return 22 + Math.floor((p - 30) / 20) * 9; }
let score = 0, strikes = 0, lorries = 0, pallets = 0, traysInPallet = 0, palletPts = 0, waste = 0;
let best = 0;
try { best = +(window.localStorage.getItem('gatekeeper_best') || 0) || 0; } catch (e) { best = 0; }
let stats = {}, shiftStats = {};
let shiftIdx = 0, shiftT = 0, coDone = false, pendingCO = false, pendingEnd = false, skuSeq = 0, co = null;
let tray = null, nextSpawn = 0, stallT = 0;
let gateOpen = false, gateAnim = 0, shake = 0, laserFlash = 0, palletFlash = 0, lorryAnim = -1;
let floats = [], banner = null, pile = [];
let muted = false, armed = false, portrait = false;
const keys = new Set(), pointers = new Set();
const held = () => keys.size > 0 || pointers.size > 0;

function freshShiftStats() { return { trays: 0, bad: 0, waste: 0, peak: ppm, pallets: 0 }; }
function float(t, x, y, c) { floats.push({ t, x, y, c: c === undefined ? 0 : c, age: 0 }); }
function showBanner(a, b, life) { banner = { a, b, t: 0, life }; }

function applySku(s) {
  sku = s; buildRails(s.h / 2 + 3);
  laserX = GATE_X - 2.5 - s.n * s.w + s.w * .5;
  robot.n = s.n; robot.w = s.w; robot.h = s.height;
}
function nextSku() {
  skuSeq++;
  if (skuSeq < SKU_ORDER.length) return SKUS[SKU_ORDER[skuSeq]];
  const ids = Object.keys(SKUS).filter(k => k !== sku.id);
  return SKUS[ids[(Math.random() * ids.length) | 0]];
}

function resetGame() {
  clearItems(); setPalette('day');
  score = 0; strikes = 0; lorries = 0; pallets = 0; traysInPallet = 0; palletPts = 0; waste = 0;
  ppm = PPM_START; peak = ppm; runT = 0; beltSet = beltSpeedFor(PPM_START); shiftIdx = 0; shiftT = 0; coDone = false; pendingCO = false; pendingEnd = false; skuSeq = 0;
  stats = { trays: 0, pallets: 0, lorries: 0, waste: 0 }; shiftStats = freshShiftStats();
  robot.moves = []; robot.cur = null; robot.carried = []; robot.busy = false;
  robot.x = HOME.x; robot.y = HOME.y; robot.z = HOME.z;
  applySku(SKUS.strawb); newTray();
  pile = []; floats = []; lorryAnim = -1; nextSpawn = .8; stallT = 0;
  forceGate(false);
  state = 'play'; stateT = 0; armed = false; entry = null;
  showBanner('DAY SHIFT', 'STRAWBS X4', 2);
}

// ================= spawning =================
let sinceBad = 99;
function spawn() {
  for (const b of items) if (b.bounds.min.x < SPAWN_X + 18) { nextSpawn = .06; return; }
  let def = sku, kind = 'product', wrong = false, crushed = false;
  const fc = .1 + Math.min(.12, runT / 1500);

      o.frequency.setValueAtTime(f0, t + start); o.frequency.linearRampToValueAtTime(f1, t + start + len);
      const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 6; lg.gain.value = f0 * .025;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + start + len * .3); lfo.stop(t + start + len + .05);
      f.type = 'bandpass'; f.Q.value = 4; f.frequency.value = vowel[0];
      f2.type = 'bandpass'; f2.Q.value = 5; f2.frequency.value = vowel[1];
      g.gain.setValueAtTime(.0001, t + start); g.gain.exponentialRampToValueAtTime(pk, t + start + .04);
      g.gain.setValueAtTime(pk, t + start + len * .7); g.gain.exponentialRampToValueAtTime(.0001, t + start + len);
      o.connect(f); o.connect(f2); f.connect(g); f2.connect(g); g.connect(master);
      o.start(t + start); o.stop(t + start + len + .05);
    };
    note(0, .3, 392, 380, [640, 1190], 1.1);      // "uh"
    note(.34, .75, 262, 233, [450, 850], 1.2);    // "oh"
    tone(80, .5, 'triangle', .35, 45, .34);
  },
  trap() { tone(120, .25, 'square', .15, 40); },
  whoosh() { noise(.35, 'bandpass', 1800, .25, 0, .5); },
  pallet() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .1, 'square', .1, null, i * .06)); },
  lorry() { tone(311, .25, 'square', .12); tone(392, .35, 'square', .12, null, .28); },
  waste() { tone(180, .08, 'square', .1, 120); },
  nice() { tone(1319, .05, 'square', .07); tone(1760, .06, 'square', .07, null, .05); },
  swap() { noise(.12, 'highpass', 1500, .3); tone(900, .08, 'square', .08, 1400); },
  chime() { tone(784, .15, 'triangle', .15); tone(1047, .25, 'triangle', .15, null, .15); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, .18, 'square', .12, null, i * .16)); },
  start() { [262, 330, 392, 523].forEach((f, i) => tone(f, .07, 'square', .1, null, i * .06)); },
  slide() { noise(.12, 'lowpass', 900, .12); },
  tick() { tone(1200, .025, 'square', .06); },
  vroom() {
    if (!AC || muted) return;
    const t = AC.currentTime, f = AC.createBiquadFilter(), g = AC.createGain();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2200, t + .45); f.frequency.exponentialRampToValueAtTime(900, t + .8);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t + .08);
    g.gain.setValueAtTime(.32, t + .5); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
    for (const [type, d] of [['sawtooth', 1], ['square', 1.027]]) {
      const o = AC.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(55 * d, t); o.frequency.exponentialRampToValueAtTime(190 * d, t + .45); o.frequency.exponentialRampToValueAtTime(130 * d, t + .8);
      o.connect(f); o.start(t); o.stop(t + .95);
    }
    f.connect(g); g.connect(master);
    noise(.5, 'bandpass', 700, .12, 0, .8);
  },
  meow(angry) {
    if (!AC || muted) return;
    const t = AC.currentTime, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    const b = angry ? 640 : 470, pk = angry ? .55 : .38, len = angry ? .6 : .5;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(b, t);
    o.frequency.linearRampToValueAtTime(b * 1.6, t + .12);
    o.frequency.linearRampToValueAtTime(b * 1.3, t + len * .6);
    o.frequency.linearRampToValueAtTime(b * .75, t + len);
    if (angry) { const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 18; lg.gain.value = 40; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + len + .05); }
    f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(650, t); f.frequency.linearRampToValueAtTime(1600, t + .15); f.frequency.linearRampToValueAtTime(850, t + len);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + .05);
    g.gain.setValueAtTime(pk, t + len * .6); g.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + len + .05);
  },
};

// ================= input =================
function onPress() {
  initAudio();
  if (state === 'title') { resetGame(); SFX.start(); }
  else if (state === 'shiftEnd' && stateT > 1) nextShift();
  else if (state === 'over' && entry && entry.done && entry.doneT > .6) { resetGame(); SFX.start(); }
}
function onRelease() { if (!held()) armed = true; }
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state === 'over' && entry && !entry.done) {
    e.preventDefault();
    if (stateT > .8) { initAudio(); entryKey(e); }
    return;
  }
  if (e.code === 'Space' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code); onPress();
});
window.addEventListener('keyup', e => { keys.delete(e.code); onRelease(); });
window.addEventListener('blur', () => { keys.clear(); pointers.clear(); onRelease(); });
window.addEventListener('pointerdown', e => {
  // grab keyboard focus (pointer preventDefault below would otherwise stop the click from doing it)
  try { window.focus(); cvs.focus({ preventScroll: true }); } catch (err) { /* ignore */ }
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (x >= 303 && x <= W && y >= 0 && y <= 11) { muted = !muted; initAudio(); return; }
  if (state === 'over' && entry && !entry.done) { if (stateT > .8) { initAudio(); entryTap(x, y); } if (e.cancelable) e.preventDefault(); return; }
  pointers.add(e.pointerId); onPress();
  if (e.cancelable) e.preventDefault();
}, { passive: false });
const up = e => { pointers.delete(e.pointerId); onRelease(); };
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', up);
window.addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  portrait = coarse && vh > vw;
  let s = Math.min((vw - 28) / W, (vh - 28) / H);
  if (s >= 1) s = Math.floor(s);
  s = Math.max(s, .5);
  cvs.style.width = (W * s) + 'px'; cvs.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ================= boot =================
setPalette('day'); genSprites(); applySku(SKUS.strawb);
let last = 0, acc = 0;
function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000; last = now; if (dt > .25) dt = .25;
  if (!portrait) {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; }
    if (n >= 8) acc = 0;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

</script>
